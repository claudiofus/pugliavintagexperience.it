    <style>
        :root {
            --bg: #a2c8f7;
            --card: #f09400;
            --surface: #ffffff;
            --text: #111111;
            --instagram: #f06c9b;
            --whatsapp: #25d366;
            --website: #4db68d;
            --phone: #7a9db3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }

        .container {
            width: min(100%, 600px);
            background: var(--card);
            border-radius: 40px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
            overflow: hidden;
        }

        .header {
            background: var(--surface);
            padding: 22px 20px;
        }

        .header h1,
        .content h2 {
            margin: 0;
            font-family: "Lobster", cursive;
            font-weight: 400;
            line-height: 1;
        }

        .header h1 {
            font-size: clamp(2.8rem, 7vw, 3.6rem);
            color: #000000;
        }

        .content {
            padding: 12px 20px 24px;
        }

        .content h2 {
            font-size: clamp(2.4rem, 6vw, 3.2rem);
            color: #ffffff;
            margin-bottom: 10px;
        }

        .content p {
            margin: 0 0 20px;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .button {
            display: block;
            width: min(100%, 320px);
            margin: 10px auto 0;
            padding: 15px 18px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .button:hover,
        .button:focus-visible {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .instagram {
            background: var(--instagram);
        }

        .whatsapp {
            background: var(--whatsapp);
        }

        .website {
            background: var(--website);
        }

        .phone {
            background: var(--phone);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                border-radius: 28px;
            }

            .header {
                padding: 18px 16px;
            }

            .content {
                padding: 10px 16px 20px;
            }
        }
    </style>
