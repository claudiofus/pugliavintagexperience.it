<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puglia Vintage Experience</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f1e3;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #d4a017;
        }
        .button {
            display: block;
            width: 80%;
            max-width: 300px;
            padding: 15px;
            margin: 10px auto;
            text-decoration: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .instagram {
            background-color: #e4405f;
        }
        .instagram:hover {
            background-color: #c13554;
        }
        .website {
            background-color: #d4a017;
        }
        .website:hover {
            background-color: #b68913;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Puglia Vintage Experience</h1>
        <p>Scopri di più sulle nostre esperienze!</p>
        <a href="https://www.instagram.com/tuoprofilo" class="button instagram" target="_blank">📸 Segui su Instagram</a>
        <a href="https://www.tuosito.com" class="button website" target="_blank">🌍 Visita il sito</a>
    </div>
</body>
</html>
